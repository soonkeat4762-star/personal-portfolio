<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khor Soon Keat Resume</title>
  <meta name="description" content="Resume viewer for Khor Soon Keat.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css?v=20260505-3">
  <style>
    .resume-viewer-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .resume-viewer-shell {
      flex: 1;
      display: flex;
      align-items: stretch;
      padding: 1.15rem 0 1.75rem;
    }

    .resume-viewer-layout {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      display: grid;
      gap: 0.8rem;
    }

    .resume-viewer-topbar {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 1.4rem;
      padding: 1rem 1.15rem;
      overflow: hidden;
      background:
        radial-gradient(circle at top right, rgba(132, 193, 255, 0.16), transparent 25%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.99), rgba(244, 250, 255, 0.98));
    }

    .resume-viewer-topbar::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(90deg, var(--primary-strong), rgba(132, 193, 255, 0.14));
    }

    .resume-viewer-copy {
      min-width: 0;
      max-width: 41rem;
    }

    .resume-viewer-copy .section-tag {
      margin-bottom: 0.75rem;
    }

    .resume-viewer-copy h1 {
      font-family: "Outfit", sans-serif;
      color: var(--heading);
      font-size: clamp(1.75rem, 2.7vw, 2.45rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
      margin-bottom: 0.38rem;
    }

    .resume-viewer-copy p {
      max-width: 35rem;
      color: var(--text-soft);
      font-size: 0.97rem;
      line-height: 1.68;
    }

    .resume-viewer-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 0.75rem;
    }

    .resume-viewer-actions .btn {
      min-width: 11.75rem;
      min-height: 3rem;
      padding: 0.82rem 1.25rem;
    }

    .resume-viewer-actions .btn-secondary {
      background: linear-gradient(180deg, #ffffff, #f5faff);
    }

    .resume-viewer-actions .btn-primary {
      box-shadow: 0 16px 32px rgba(84, 168, 255, 0.24);
    }

    .resume-viewer-frame-wrap {
      position: relative;
      overflow: hidden;
      padding: 0.62rem;
      border: 1px solid rgba(132, 193, 255, 0.22);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.99), rgba(241, 248, 255, 0.98));
      box-shadow:
        0 20px 42px rgba(67, 108, 155, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.82);
    }

    .resume-viewer-frame-wrap::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.72);
      pointer-events: none;
    }

    .resume-viewer-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 9.8rem);
      min-height: 42rem;
      border: 0;
      border-radius: 1.2rem;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(132, 193, 255, 0.14);
    }

    .resume-viewer-shell .soft-card:hover {
      transform: translateY(-6px) scale(1.01);
    }

    .resume-viewer-frame-wrap:hover {
      box-shadow:
        0 24px 48px rgba(67, 108, 155, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.82);
    }

    @media (max-width: 1100px) {
      .resume-viewer-frame {
        height: calc(100vh - 10.4rem);
        min-height: 39rem;
      }
    }

    @media (max-width: 1024px) {
      .resume-viewer-topbar {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .resume-viewer-actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 767px) {
      .resume-viewer-shell {
        padding: 0.85rem 0 1.25rem;
      }

      .resume-viewer-layout {
        width: min(1180px, calc(100% - 1.25rem));
        gap: 0.75rem;
      }

      .resume-viewer-topbar {
        gap: 1rem;
        padding: 0.95rem 1rem;
      }

      .resume-viewer-copy h1 {
        font-size: clamp(1.65rem, 6vw, 2.1rem);
      }

      .resume-viewer-copy p {
        font-size: 0.94rem;
      }

      .resume-viewer-actions .btn {
        width: 100%;
        min-width: 0;
      }

      .resume-viewer-frame-wrap {
        padding: 0.5rem;
      }

      .resume-viewer-frame {
        height: calc(100vh - 13.3rem);
        min-height: 31rem;
      }
    }

    @media (max-width: 480px) {
      .resume-viewer-topbar {
        padding: 0.9rem 0.9rem 0.95rem;
      }

      .resume-viewer-copy .section-tag {
        margin-bottom: 0.65rem;
      }

      .resume-viewer-copy h1 {
        font-size: 1.55rem;
      }

      .resume-viewer-frame {
        min-height: 27rem;
      }
    }
  </style>
</head>
<body class="resume-viewer-page">
  <main class="resume-viewer-shell page-shell">
    <div class="resume-viewer-layout">
      <section class="soft-card resume-viewer-topbar">
        <div class="resume-viewer-copy">
          <p class="section-tag">Resume Viewer</p>
          <h1>Khor Soon Keat Resume</h1>
          <p>View the embedded resume below or open the PDF directly in your browser viewer.</p>
        </div>
        <div class="resume-viewer-actions">
          <a class="btn btn-secondary btn-small" href="index.html">Back to Home</a>
          <a
            class="btn btn-primary btn-small"
            href="pdf/Khor%20Soon%20Keat%20Resume.pdf"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open PDF Directly
          </a>
        </div>
      </section>

      <section class="soft-card resume-viewer-frame-wrap">
        <iframe
          class="resume-viewer-frame"
          src="pdf/Khor%20Soon%20Keat%20Resume.pdf"
          title="Khor Soon Keat Resume PDF"
        ></iframe>
      </section>
    </div>
  </main>
</body>
</html>
